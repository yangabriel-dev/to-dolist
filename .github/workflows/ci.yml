name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (regras duras: sem useEffect, sem console, grafo de imports)
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes e2e (verificacao de comportamento)
        run: npm run test:e2e
        env:
          CI: true
      - name: Tamanho do PR (aviso)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          LINES=$(git diff --shortstat origin/${{ github.base_ref }}...HEAD | grep -oE '[0-9]+ (insertion|deletion)' | awk '{s+=$1} END {print s+0}')
          echo "Linhas alteradas: $LINES"
          if [ "$LINES" -gt 400 ]; then echo "::warning::PR com $LINES linhas. Prefira PRs pequenos e atomicos (meta: ate 400)."; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
